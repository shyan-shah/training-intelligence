name: Nightly compute

# Runs after every ingest, and on a cron as a backstop.
#
# The cron alone was not enough, for two reasons seen on 2026-11-03. Actions
# schedules are best effort: this fired at 09:27 against an 02:12 cron, the
# 05:17 ingest was dropped entirely, and the 11:17 ingest landed at 12:45. So
# compute ran three hours before the day's data arrived and the page showed
# yesterday.
#
# The ordering was also wrong by design. At 02:12 last night's sleep and HRV
# are not in Garmin yet; they arrive with the 05:17 ingest. Today's readiness
# — the number worth having in the morning — therefore waited for tomorrow's
# run, about 21 hours late.
#
# Chaining to the ingest fixes both: whenever data actually lands, however
# late, the numbers follow it. The cron stays so a day with no ingest at all
# still recomputes.
on:
  schedule:
    - cron: "12 2 * * *"
  workflow_run:
    workflows: ["Ingest"]
    types: [completed]
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to recompute"
        default: "180"

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  compute:
    # A failed ingest wrote nothing worth recomputing, and its own log is the
    # place that failure should be read. Schedule and manual runs are never
    # gated.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Compute load, readiness, scorecard and insights
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TI_USER_ID: ${{ secrets.TI_USER_ID }}
        run: python -m engine.ti.nightly --days "${{ inputs.days || 180 }}"
