name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      # Drives every tab in both colour schemes against fixture data, failing
      # on console errors or horizontal overflow. This is what caught the
      # hydration mismatch and the three-up stat row spilling off a phone.
      - run: npx playwright install --with-deps chromium

      - name: Start the app and smoke test every tab
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          ENABLE_PREVIEW: "1"
        run: |
          npm start -- -p 3100 &
          npx wait-on http://localhost:3100/preview --timeout 60000
          BASE_URL=http://localhost:3100 npm run smoke
